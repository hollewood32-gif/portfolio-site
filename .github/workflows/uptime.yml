# Uptime check: every hour, visit the live sites (scripts/check-sites.mjs).
#   - Something broken -> open a GitHub issue labelled "site-down" (GitHub emails
#     the owner), or add a comment if one is already open.
#   - Everything fine again -> comment "back up" and close that issue.
#
# On pull requests that change this check, it only runs the check (no issues),
# so the PR proves it works. "Run workflow" in the Actions tab runs it by hand,
# with an optional fault drill that is meant to fail, to test the alerts.
name: Uptime

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17 (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      fault_drill:
        description: "Add a check that is meant to fail (tests the alert)"
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/check-sites.mjs
      - .github/workflows/uptime.yml

# Never run two checks at once (so we can't open two issues).
concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # to open, comment on and close the alert issue

jobs:
  check:
    name: check sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check every address
        id: check
        continue-on-error: true # let the next steps handle a failure
        env:
          FAULT_DRILL: ${{ inputs.fault_drill && '1' || '0' }}
        run: node scripts/check-sites.mjs

      - name: Open or update the alert issue
        if: steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create site-down --color B60205 --description "Uptime check is failing" --force
          printf '\n[Workflow run](%s)\n' "$RUN_URL" >> uptime-report.md
          open=$(gh issue list --label site-down --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file uptime-report.md
          else
            gh issue create --title "Site check failing" --label site-down --body-file uptime-report.md
          fi

      - name: Close the alert issue when everything is back up
        if: steps.check.outcome == 'success' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label site-down --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "Back up: all checks pass again. $(date -u +%Y-%m-%dT%H:%MZ)"
          fi

      - name: Mark the run as failed if a check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
